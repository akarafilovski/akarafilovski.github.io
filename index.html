<script>
(function(){
  var card=document.getElementById('card'),front=document.getElementById('front'),back=document.querySelector('.back'),apps=document.getElementById('back-about');
  function toggle(){
    var on=!card.classList.contains('flipped');
    card.classList.toggle('flipped',on);
    front.setAttribute('aria-hidden',on?'true':'false');back.setAttribute('aria-hidden',on?'false':'true');
    apps.tabIndex=on?0:-1;
  }
  document.getElementById('flip').addEventListener('click',toggle);
  card.addEventListener('click',function(e){if(e.target.closest('a,button'))return;toggle()});
})();
